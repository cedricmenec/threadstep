schema: spec-driven

context: |
  ThreadStep is a public, static, French-language app. Its product contract lives
  in docs/product/ and its authorized scope in backlog/tasks/TS-NNN.md.
  Read AGENTS.md first. Preserve browser-local data and JSON import/export
  compatibility. Do not add a server, authentication, telemetry or dependencies.
  Agent delivery is by reviewed pull request only, never directly to main.

rules:
  proposal:
    - State user value, non-goals and unresolved decisions explicitly.
  specs:
    - Describe observable behaviors with WHEN/THEN scenarios.
  tasks:
    - The checkbox checklist is exclusively for implementation and automated tests executable and verifiable in the runner during apply BEFORE OPSX sync and archive.
    - Cover relevant acceptance criteria with deterministic pre-sync tests when feasible; preserve human-only criteria as plain text in a Manual acceptance section WITHOUT checkboxes.
    - Put post-sync semantic comparison, archive, independent PR CI, merge and Pages verification in a Post-sync review section WITHOUT checkboxes.
    - Do not include manual browser, touch, keyboard, visual or screen-reader acceptance as checkbox tasks, and never report unperformed checks as passed.
