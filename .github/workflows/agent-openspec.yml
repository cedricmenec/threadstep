name: Agent OpenSpec (manual, staged or auto)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task number (9 or 009) or full ID (TS-009); existing backlog only'
        required: true
        type: string
      phase:
        description: 'auto is default: 3 paid OpenCode calls (plan, apply, OPSX sync); no USD cap'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - plan
          - apply
          - finalize
      auto_merge:
        description: 'Automatically merge final PR only after required independent CI succeeds (never plan)'
        required: true
        type: boolean
        default: true
      model:
        description: 'OpenRouter model'
        required: true
        type: choice
        default: 'openrouter/deepseek/deepseek-v4.1-flash'
        options:
          - 'openrouter/deepseek/deepseek-v4.1-flash'
          - 'openrouter/z-ai/glm-5.3-flash'

  workflow_call:
    # Reusable entry for a reviewed, owner-dispatched orchestrator on main only.
    inputs:
      task_id:
        required: true
        type: string
      phase:
        required: true
        type: string
      auto_merge:
        required: true
        type: boolean
      model:
        required: true
        type: string
      wave_id:
        required: true
        type: string
      parent_run_id:
        required: true
        type: string
      reservation_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Normalize before any model installation or paid call. The same task
  # aliases share one canonical branch and one task-scoped concurrency key.
  normalize-task:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      task_id: ${{ steps.normalize.outputs.task_id }}
    steps:
      - name: Checkout task normalizer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and normalize task input
        id: normalize
        shell: bash
        env:
          RAW_TASK_ID: ${{ inputs.task_id }}
          GH_TOKEN: ${{ github.token }}
          ASF_WAVE_ID: ${{ inputs.wave_id }}
          ASF_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          ASF_RESERVATION_SHA: ${{ inputs.reservation_sha }}
          PHASE: ${{ inputs.phase }}
          OPENCODE_MODEL: ${{ inputs.model }}
          ASF_AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          set -euo pipefail
          task_id="$(node scripts/normalize-task-id.mjs "$RAW_TASK_ID")"
          test -f "backlog/tasks/$task_id.md" || {
            echo "::error::Backlog file missing: $task_id"; exit 1;
          }
          # Manual dispatch stays owner-only; a reusable call must prove
          # immutable wave authorization and one reserved paid task first.
          if [[ -n "${ASF_WAVE_ID:-}" || -n "${ASF_PARENT_RUN_ID:-}" || -n "${ASF_RESERVATION_SHA:-}" ]]; then
            test -n "${ASF_WAVE_ID:-}" && test -n "${ASF_PARENT_RUN_ID:-}" && test -n "${ASF_RESERVATION_SHA:-}" || {
              echo "::error::Incomplete orchestrated authorization"; exit 1;
            }
            TASK_ID="$task_id" node scripts/asf/waves/authenticate-executor.mjs
          elif [[ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/agent-openspec.yml@$GITHUB_REF" ]]; then
            echo "::error::Unrecognized workflow caller without a verified reservation"; exit 1
          fi
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

  staged-development:
    needs: normalize-task
    if: github.actor == github.repository_owner
    # Shared paid job lock, never held by the future orchestrator parent.
    concurrency:
      group: threadstep-paid-development-v1
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      TASK_ID: ${{ needs.normalize-task.outputs.task_id }}
      PHASE: ${{ inputs.phase }}
      OPENCODE_MODEL: ${{ inputs.model }}
      OPENSPEC_NO_UPDATE_CHECK: '1'
      OPENSPEC_NO_ANIMATION: '1'
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Validate request and select persistent branch
        shell: bash
        run: |
          set -euo pipefail
          # The independent preflight job provides a canonical TS-NNN already
          # checked against the backlog; recheck after the second checkout.
          [[ "$TASK_ID" =~ ^TS-[0-9]{3}$ ]] || {
            echo "::error::Normalized task ID is invalid"; exit 1;
          }
          [[ "$PHASE" == plan || "$PHASE" == apply || "$PHASE" == auto || "$PHASE" == finalize ]] || { echo "::error::Invalid phase"; exit 1; }
          test -f "backlog/tasks/$TASK_ID.md" || { echo "::error::Backlog file missing"; exit 1; }
          test -f openspec/config.yaml || { echo "::error::OpenSpec config missing"; exit 1; }
          git config user.name "threadstep-software-factory[bot]"
          git config user.email "threadstep-software-factory[bot]@users.noreply.github.com"
          git fetch origin main
          branch="agent/openspec/$TASK_ID"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
          else
            if [[ "$PHASE" == apply || "$PHASE" == finalize ]]; then
              echo "::error::No existing agent branch. Run plan/apply/auto first."; exit 1
            fi
            git checkout -b "$branch"
          fi
          echo "AGENT_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "CHANGE_ID=$(printf '%s' "$TASK_ID" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Install pinned OpenSpec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @fission-ai/openspec@1.14.1
          openspec --version

      - name: Install OpenCode (paid model phases only)
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@latest
          opencode --version

      - name: Initialize OpenSpec skills and commands for OpenCode
        shell: bash
        run: |
          set -euo pipefail
          # CLI installation does not install agent skills/commands by itself.
          # Generate them on the ephemeral runner using the same pinned OpenSpec.
          openspec init --tools opencode,agents
          test -s .opencode/skills/openspec-sync-specs/SKILL.md
          test -s .opencode/commands/opsx-sync.md
          test -s .agents/skills/openspec-sync-specs/SKILL.md
          # Keep generated, runner-local instructions out of feature commits/PRs.
          printf '\n/.opencode/\n/.agents/\n' >> .git/info/exclude
          test -z "$(git status --porcelain)" || {
            echo "::error::OpenSpec init unexpectedly changed tracked project files"; exit 1;
          }

      - name: Prepare or validate OpenSpec change
        shell: bash
        run: |
          set -euo pipefail
          change="openspec/changes/$CHANGE_ID"
          if [[ "$PHASE" == plan || "$PHASE" == auto ]]; then
            if find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE_ID" 2>/dev/null | grep -q .; then
              echo "::error::Change already archived"; exit 1
            fi
            if [[ ! -d "$change" ]]; then
              openspec new change "$CHANGE_ID" --schema spec-driven
            fi
          else
            for file in proposal.md design.md tasks.md; do
              test -s "$change/$file" || { echo "::error::Missing plan artifact: $file"; exit 1; }
            done
            find "$change/specs" -name spec.md -type f -size +0c | grep -q . || {
              echo "::error::Missing nonempty delta spec"; exit 1;
            }
            openspec validate "$CHANGE_ID" --strict --no-interactive
            node scripts/check-openspec-task-phases.mjs "$change/tasks.md"
          fi

      - name: Explore and propose, no product code changes
        if: inputs.phase == 'plan' || inputs.phase == 'auto'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OpenRouter secret missing"; exit 1; }
          {
            cat <<'PROMPT'
          You are preparing a spec-driven change in ThreadStep. Read AGENTS.md, the product specs,
          and the chosen backlog task. Explore existing behavior before proposing a change.
          Use 'openspec status --change CHANGE' and 'openspec instructions ARTIFACT --change CHANGE'
          for proposal, design, specs and tasks, replacing CHANGE with the selected change ID.
          Produce complete OpenSpec proposal.md, design.md, specs/<capability>/spec.md and tasks.md.
          Specify GIVEN/WHEN/THEN-style observable scenarios and a testable implementation checklist.
          Every tasks.md checkbox MUST be fully completable during implementation BEFORE
          the separate workflow steps for semantic OPSX sync and archive. Put any post-sync
          diff comparison, archive verification or independent PR CI review in a plain
          'Post-sync review' section WITHOUT checkboxes, not in the apply checklist.
          During plan, NEVER modify application code, tests, product specs, backlog, workflow files,
          AGENTS.md, configuration, secrets, or other changes. No commit, push, PR or paid subagent.
          Do not archive. Report uncertainties in proposal.md, do not invent product decisions.
          PROMPT
            printf '\nChange ID: %s\nBacklog task: %s\n' "$CHANGE_ID" "$TASK_ID"
            cat "backlog/tasks/$TASK_ID.md"
          } > "$RUNNER_TEMP/openspec-plan-prompt.txt"
          opencode run --auto --model "$OPENCODE_MODEL" "$(cat "$RUNNER_TEMP/openspec-plan-prompt.txt")"

      - name: Validate the produced plan
        if: inputs.phase == 'plan' || inputs.phase == 'auto'
        shell: bash
        run: |
          set -euo pipefail
          change="openspec/changes/$CHANGE_ID"
          for file in proposal.md design.md tasks.md; do
            test -s "$change/$file" || { echo "::error::Missing required OpenSpec artifact: $file"; exit 1; }
          done
          find "$change/specs" -name spec.md -type f -size +0c | grep -q . || {
            echo "::error::Missing nonempty spec delta"; exit 1;
          }
          grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]xX]\]' "$change/tasks.md" || {
            echo "::error::No tasks in checklist"; exit 1;
          }
          openspec validate "$CHANGE_ID" --strict --no-interactive
          node scripts/check-openspec-task-phases.mjs "openspec/changes/$CHANGE_ID/tasks.md"
          npm run check

      - name: Guard auto plan scope before implementation
        if: inputs.phase == 'auto'
        shell: bash
        run: |
          set -euo pipefail
          # Reject plan-time modifications outside this change before starting the paid apply call.
          changed="$( (git diff --name-only; git ls-files --others --exclude-standard) | sort -u )"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              "openspec/changes/$CHANGE_ID/"*) ;;
              *) echo "::error::Auto plan changed a forbidden path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          # Freeze the reviewed plan artifacts in a local commit so apply cannot rewrite them.
          git add -- "openspec/changes/$CHANGE_ID"
          git commit -m "agent($TASK_ID): OpenSpec auto plan"
          echo "AUTO_PLAN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply the reviewed plan with OpenCode
        if: inputs.phase == 'apply' || inputs.phase == 'auto'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OpenRouter secret missing"; exit 1; }
          {
            cat <<'PROMPT'
          Implement ONLY the existing, previously proposed OpenSpec change.
          First read AGENTS.md, the backlog task and all change artifacts. Run
          'openspec instructions apply --change CHANGE' with the actual change ID.
          Implement the smallest solution meeting every delta spec and acceptance criterion.
          Add/update tests, run npm run check and mark tasks.md items [x] only when actually done.
          Do not alter proposal.md, design.md, delta specs or the canonical specs.
          Do not edit workflows, AGENTS.md, backlog, secrets or execution configuration.
          Do not archive, commit, push, merge or open a PR: the workflow performs these steps.
          If requirements are ambiguous or tests fail, stop and report the blocker.
          PROMPT
            printf '\nChange ID: %s\nBacklog task: %s\n' "$CHANGE_ID" "$TASK_ID"
            cat "backlog/tasks/$TASK_ID.md"
          } > "$RUNNER_TEMP/openspec-apply-prompt.txt"
          opencode run --auto --model "$OPENCODE_MODEL" "$(cat "$RUNNER_TEMP/openspec-apply-prompt.txt")"

      - name: Verify, semantic sync and archive OpenSpec
        if: inputs.phase == 'apply' || inputs.phase == 'auto' || inputs.phase == 'finalize'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Finalize starts from a clean committed agent branch before semantic sync.
          if [[ "$PHASE" == finalize ]]; then
            test -z "$(git status --porcelain)" || {
              echo "::error::Finalize requires a clean worktree"; exit 1;
            }
            test -d "openspec/changes/$CHANGE_ID" || {
              echo "::error::Active change missing or already archived"; exit 1;
            }
          fi
          # The implementer may check off tasks, but cannot silently rewrite the approved plan.
          plan_edits="$( (git diff --name-only -- "openspec/changes/$CHANGE_ID"; git ls-files --others --exclude-standard -- "openspec/changes/$CHANGE_ID") | sort -u )"
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == "openspec/changes/$CHANGE_ID/tasks.md" ]] && continue
            echo "::error::Apply rewrote a reviewed OpenSpec artifact: $path"; exit 1
          done <<< "$plan_edits"
          tasks="openspec/changes/$CHANGE_ID/tasks.md"
          grep -Eq '^[[:space:]]*-[[:space:]]+\[[xX]\]' "$tasks" || {
            echo "::error::No completed checklist entries"; exit 1;
          }
          if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' "$tasks"; then
            echo "::error::Unchecked tasks remain; refusing archive"; exit 1
          fi
          npm run check
          openspec validate "$CHANGE_ID" --strict --no-interactive
          # Semantic sync: OpenCode follows the OpenSpec /opsx:sync workflow.
          # A separate paid model call is required in apply, auto and finalize.
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OpenRouter secret missing"; exit 1; }
          # Check actual bytes, even for files already modified by apply.
          node scripts/sync-guard.mjs snapshot "$RUNNER_TEMP/opsx-sync-before.json"
          # Invoke the command generated by openspec init, not a plain text
          # request merely mentioning /opsx:sync.
          opencode run --auto --model "$OPENCODE_MODEL" --command opsx-sync "$CHANGE_ID"
          node scripts/sync-guard.mjs verify "$RUNNER_TEMP/opsx-sync-before.json"
          # The LLM already synced canonical specs; archive without a second merge.
          openspec archive "$CHANGE_ID" --yes --skip-specs
          find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE_ID" | grep -q . || {
            echo "::error::OpenSpec archive missing"; exit 1;
          }
          openspec validate --all --strict --no-interactive
          openspec validate --archived --strict --no-interactive

      - name: Guard scope, commit and publish PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$AGENT_BRANCH" || {
            echo "::error::Work branch changed"; exit 1;
          }
          changed="$( (git diff --name-only origin/main...HEAD; git diff --name-only; git ls-files --others --exclude-standard) | sort -u )"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$PHASE" == plan ]]; then
              case "$path" in
                "openspec/changes/$CHANGE_ID/"*) ;;
                *) echo "::error::Plan changed a forbidden path: $path"; exit 1 ;;
              esac
            else
              case "$path" in
                .github/*|AGENTS.md|opencode.json|openspec/config.yaml|.opencode/*|.agents/*|backlog/*|scripts/*|docs/factory/*|.env|.env.*)
                  echo "::error::Apply changed a protected path: $path"; exit 1 ;;
              esac
            fi
          done <<< "$changed"
          if [[ "$PHASE" == finalize ]]; then
            # Do not publish any uncommitted changes except the archive/sync output.
            # Existing feature commits are allowed on the task branch.
            git diff --name-only | while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                openspec/changes/"$CHANGE_ID"/*|openspec/changes/archive/*-"$CHANGE_ID"/*|openspec/specs/*) ;;
                *) echo "::error::Finalize changed forbidden path: $path"; exit 1 ;;
              esac
            done
          fi
          test -n "$changed" || { echo "::error::No changes to publish"; exit 1; }
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "agent($TASK_ID): OpenSpec $PHASE"
          fi
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -u origin "HEAD:$AGENT_BRANCH"
          existing="$(gh pr list --head "$AGENT_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$existing" ]]; then
            if [[ "$PHASE" == plan ]]; then
              gh pr create --draft --base main --head "$AGENT_BRANCH" \
                --title "OpenSpec: $TASK_ID" \
                --body "Phase plan: review the proposed OpenSpec change before manually running phase apply. No product code is changed by planning. **Never auto-merge a plan**."
            else
              gh pr create --base main --head "$AGENT_BRANCH" \
                --title "OpenSpec: $TASK_ID" \
                --body "Phase $PHASE: OpenSpec validated and archived. Independent CI required; native auto-merge may be requested if enabled and Protect Main enforces CI/check."
            fi
          else
            echo "Updated pull request: $existing"
            if [[ "$PHASE" != plan ]] && [[ "$(gh pr view "$existing" --json isDraft --jq .isDraft)" == true ]]; then
              gh pr ready "$existing"
            fi
          fi
          echo "PR_PUBLISHED=true" >> "$GITHUB_ENV"

      - name: Request safe auto-merge only for completed OpenSpec changes
        if: inputs.auto_merge == true && inputs.phase != 'plan' && env.PR_PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never auto-merge plan PRs. Gate on main ruleset + CI/check.
          node scripts/request-safe-auto-merge.mjs
