name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all GitHub Actions workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          # Pin the validator; workflow syntax was previously unchecked by CI.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color=false
      - name: Install pinned frontend dependencies
        run: npm ci
      - name: Run independent tests and syntax checks
        run: npm run check
      - name: Build Vite production artifact
        run: npm run build
      - name: Verify reproducible and secure artifact
        run: npm run verify:build
      - name: Verify Vite preview and development servers
        run: npm run verify:servers
      - name: Smoke test pinned OpenCode Linux CLI (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@1.19.0
          installed_version="$(opencode --version)"
          if [[ "$installed_version" != "1.19.0" ]]; then
            echo "::error::OpenCode version mismatch: expected 1.19.0, got $installed_version"; exit 1
          fi
      - name: Validate OpenSpec changes and archive independently
        if: hashFiles('openspec/config.yaml') != ''
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @fission-ai/openspec@1.14.1
          openspec validate --all --strict --no-interactive
          openspec validate --archived --strict --no-interactive
