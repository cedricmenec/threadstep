name: Agent OpenSpec (manual, staged or auto)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task number (9 or 009) or full ID (TS-009); existing backlog only'
        required: true
        type: string
      phase:
        description: 'auto is default: 3 paid OpenCode calls (plan, apply, OPSX sync); no USD cap'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - plan
          - apply
          - finalize
      auto_merge:
        description: 'Automatically merge final PR only after required independent CI succeeds (never plan)'
        required: true
        type: boolean
        default: true
      model:
        description: 'OpenRouter model'
        required: true
        type: choice
        default: 'openrouter/deepseek/deepseek-v4.1-flash-1017'
        options:
          - 'openrouter/deepseek/deepseek-v4.1-flash'
          - 'openrouter/deepseek/deepseek-v4.1-flash-1017'
          - 'openrouter/z-ai/glm-5.3-flash'

  workflow_call:
    # Reusable entry for a reviewed, owner-dispatched orchestrator on main only.
    inputs:
      task_id:
        required: true
        type: string
      phase:
        required: true
        type: string
      auto_merge:
        required: true
        type: boolean
      model:
        required: true
        type: string
      wave_id:
        required: true
        type: string
      parent_run_id:
        required: true
        type: string
      reservation_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Normalize before any model installation or paid call. The same task
  # aliases share one canonical branch and one task-scoped concurrency key.
  normalize-task:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      task_id: ${{ steps.normalize.outputs.task_id }}
    steps:
      - name: Checkout task normalizer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and normalize task input
        id: normalize
        shell: bash
        env:
          RAW_TASK_ID: ${{ inputs.task_id }}
          GH_TOKEN: ${{ github.token }}
          ASF_WAVE_ID: ${{ inputs.wave_id }}
          ASF_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          ASF_RESERVATION_SHA: ${{ inputs.reservation_sha }}
          PHASE: ${{ inputs.phase }}
          OPENCODE_MODEL: ${{ inputs.model }}
          ASF_AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          set -euo pipefail
          task_id="$(node scripts/normalize-task-id.mjs "$RAW_TASK_ID")"
          test -f "backlog/tasks/$task_id.md" || {
            echo "::error::Backlog file missing: $task_id"; exit 1;
          }
          # Manual dispatch stays owner-only; a reusable call must prove
          # immutable wave authorization and one reserved paid task first.
          if [[ -n "${ASF_WAVE_ID:-}" || -n "${ASF_PARENT_RUN_ID:-}" || -n "${ASF_RESERVATION_SHA:-}" ]]; then
            if [[ -z "${ASF_WAVE_ID:-}" || -z "${ASF_PARENT_RUN_ID:-}" || -z "${ASF_RESERVATION_SHA:-}" ]]; then
              echo "::error::Incomplete orchestrated authorization"; exit 1
            fi
            TASK_ID="$task_id" node scripts/asf/waves/authenticate-executor.mjs
          elif [[ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/agent-openspec.yml@$GITHUB_REF" ]]; then
            echo "::error::Unrecognized workflow caller without a verified reservation"; exit 1
          fi
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

  staged-development:
    needs: normalize-task
    if: github.actor == github.repository_owner
    # Shared paid job lock, never held by the future orchestrator parent.
    concurrency:
      group: threadstep-paid-development-v1
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Built-in token stays read-only; the existing installation token handles PR writes.
    permissions:
      contents: read
    env:
      TASK_ID: ${{ needs.normalize-task.outputs.task_id }}
      PHASE: ${{ inputs.phase }}
      OPENCODE_MODEL: ${{ inputs.model }}
      ASF_WAVE_ID: ${{ inputs.wave_id }}
      OPENSPEC_NO_UPDATE_CHECK: '1'
      OPENSPEC_NO_ANIMATION: '1'
    steps:
      - name: Checkout without persisted token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Validate request and select persistent branch
        shell: bash
        run: |
          set -euo pipefail
          # The independent preflight job provides a canonical TS-NNN already
          # checked against the backlog; recheck after the second checkout.
          [[ "$TASK_ID" =~ ^TS-[0-9]{3}$ ]] || {
            echo "::error::Normalized task ID is invalid"; exit 1;
          }
          [[ "$PHASE" == plan || "$PHASE" == apply || "$PHASE" == auto || "$PHASE" == finalize ]] || { echo "::error::Invalid phase"; exit 1; }
          test -f "backlog/tasks/$TASK_ID.md" || { echo "::error::Backlog file missing"; exit 1; }
          test -f openspec/config.yaml || { echo "::error::OpenSpec config missing"; exit 1; }
          git config user.name "threadstep-software-factory[bot]"
          git config user.email "threadstep-software-factory[bot]@users.noreply.github.com"
          git fetch origin main
          if [[ -n "${ASF_WAVE_ID:-}" ]]; then
            # Each slot starts from the latest main containing earlier verified
            # deliveries; the task brief must still match the original snapshot.
            before="$(git show "HEAD:backlog/tasks/$TASK_ID.md" | sha256sum | cut -d ' ' -f1)"
            git checkout --detach origin/main
            after="$(sha256sum "backlog/tasks/$TASK_ID.md" | cut -d ' ' -f1)"
            if [[ "$before" != "$after" ]]; then
              echo "::error::Authorized task brief changed since wave opening"; exit 1
            fi
          fi
          branch="agent/openspec/$TASK_ID"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
          else
            if [[ "$PHASE" == apply || "$PHASE" == finalize ]]; then
              echo "::error::No existing agent branch. Run plan/apply/auto first."; exit 1
            fi
            git checkout -b "$branch"
          fi
          # Recognize a checkpoint saved by a PREVIOUS workflow invocation.
          # finalize/apply resumes must report the remote SHA even on early failure.
          last_message="$(git log -1 --format=%s)"
          if [[ "$last_message" == "agent($TASK_ID): verified implementation checkpoint" ]]; then
            echo "LAST_DURABLE_PHASE=apply" >> "$GITHUB_ENV"
            echo "CHECKPOINT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          elif [[ "$last_message" == "agent($TASK_ID): validated OpenSpec plan checkpoint" ]]; then
            echo "LAST_DURABLE_PHASE=plan" >> "$GITHUB_ENV"
            echo "CHECKPOINT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          echo "AGENT_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "CHANGE_ID=$(printf '%s' "$TASK_ID" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Checkpoint policy belongs to the trusted, current factory on main.
      # The persistent task branch may be based on an older main; do not execute
      # its stale scope guard when resuming a paid apply.
      - name: Load checkpoint verifier from trusted main
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:scripts/agent-openspec-checkpoint.mjs > "$RUNNER_TEMP/agent-openspec-checkpoint.mjs"
          test -s "$RUNNER_TEMP/agent-openspec-checkpoint.mjs"
          node --check "$RUNNER_TEMP/agent-openspec-checkpoint.mjs"

      # A resumed agent branch can predate this security fix. Always load the
      # model allowlist from trusted main, never from the editable task branch.
      # This sets OPENCODE_CONFIG_CONTENT for ALL later OpenCode plan/apply/sync
      # calls. The hidden title agent is disabled and small_model is pinned.
      - name: Enforce trusted OpenCode model policy before paid calls
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:scripts/asf/opencode-model-policy.mjs > "$RUNNER_TEMP/opencode-model-policy.mjs"
          test -s "$RUNNER_TEMP/opencode-model-policy.mjs"
          node --check "$RUNNER_TEMP/opencode-model-policy.mjs"
          node "$RUNNER_TEMP/opencode-model-policy.mjs"

      - name: Install pinned OpenSpec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @fission-ai/openspec@1.14.1
          openspec --version

      - name: Install OpenCode (paid model phases only)
        shell: bash
        run: |
          set -euo pipefail
          npm install --global opencode-ai@latest
          opencode --version

      - name: Initialize OpenSpec skills and commands for OpenCode
        shell: bash
        run: |
          set -euo pipefail
          # CLI installation does not install agent skills/commands by itself.
          # Generate them on the ephemeral runner using the same pinned OpenSpec.
          openspec init --tools opencode,agents
          test -s .opencode/skills/openspec-sync-specs/SKILL.md
          test -s .opencode/commands/opsx-sync.md
          test -s .agents/skills/openspec-sync-specs/SKILL.md
          # Keep generated, runner-local instructions out of feature commits/PRs.
          printf '\n/.opencode/\n/.agents/\n' >> .git/info/exclude
          test -z "$(git status --porcelain)" || {
            echo "::error::OpenSpec init unexpectedly changed tracked project files"; exit 1;
          }

      - name: Prepare or validate OpenSpec change
        shell: bash
        run: |
          set -euo pipefail
          change="openspec/changes/$CHANGE_ID"
          if [[ "$PHASE" == plan || "$PHASE" == auto ]]; then
            # A durable plan on the existing branch must be resumed with apply,
            # not silently overwritten or regenerated with another paid plan call.
            if [[ -s "$change/proposal.md" || -s "$change/design.md" || -s "$change/tasks.md" ]]; then
              echo "::error::Existing OpenSpec plan on $AGENT_BRANCH; use phase=apply after reviewing it"; exit 1
            fi
            if find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE_ID" 2>/dev/null | grep -q .; then
              echo "::error::Change already archived"; exit 1
            fi
            if [[ ! -d "$change" ]]; then
              openspec new change "$CHANGE_ID" --schema spec-driven
            fi
          else
            for file in proposal.md design.md tasks.md; do
              test -s "$change/$file" || { echo "::error::Missing plan artifact: $file"; exit 1; }
            done
            find "$change/specs" -name spec.md -type f -size +0c | grep -q . || {
              echo "::error::Missing nonempty delta spec"; exit 1;
            }
            openspec validate "$CHANGE_ID" --strict --no-interactive
            node scripts/check-openspec-task-phases.mjs "$change/tasks.md"
          fi

      - name: Explore and propose, no product code changes
        if: inputs.phase == 'plan' || inputs.phase == 'auto'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OpenRouter secret missing"; exit 1; }
          {
            cat <<'PROMPT'
          You are preparing a spec-driven change in ThreadStep. Read AGENTS.md, the product specs,
          and the chosen backlog task. Explore existing behavior before proposing a change.
          Use 'openspec status --change CHANGE' and 'openspec instructions ARTIFACT --change CHANGE'
          for proposal, design, specs and tasks, replacing CHANGE with the selected change ID.
          Produce complete OpenSpec proposal.md, design.md, specs/<capability>/spec.md and tasks.md.
          Specify GIVEN/WHEN/THEN-style observable scenarios covering ALL product requirements.
          Read docs/factory/openspec-checklist-contract.md and follow its
          docs/factory/examples/openspec-tasks-example.md example when writing tasks.md.
          Divide tasks.md into a pre-sync implementation checklist, a plain
          'Manual acceptance' section, and a plain 'Post-sync review' section.
          Every checkbox MUST be completable and provable on this GitHub Actions
          runner during apply, BEFORE semantic OPSX sync, archive, PR publication or CI.
          For UI behavior, add deterministic automated tests to the checklist when
          feasible, but put real-browser visual, mobile/touch, keyboard, focus and
          screen-reader acceptance checks in 'Manual acceptance' WITHOUT checkboxes.
          Put post-sync semantic diffs, archive checks, independent PR CI, merge and
          Pages checks in 'Post-sync review' WITHOUT checkboxes.
          The manual and post-sync checks remain required for truthful acceptance,
          but are NOT claims of completion or reasons to mark checklist tasks [x].
          Never turn every backlog acceptance criterion into a checkbox automatically.
          During plan, NEVER modify application code, tests, product specs, backlog, workflow files,
          AGENTS.md, configuration, secrets, or other changes. No commit, push, PR or paid subagent.
          Do not archive. Report uncertainties in proposal.md, do not invent product decisions.
          PROMPT
            printf '\nChange ID: %s\nBacklog task: %s\n' "$CHANGE_ID" "$TASK_ID"
            cat "backlog/tasks/$TASK_ID.md"
          } > "$RUNNER_TEMP/openspec-plan-prompt.txt"
          opencode run --auto --model "$OPENCODE_MODEL" "$(cat "$RUNNER_TEMP/openspec-plan-prompt.txt")"

      - name: Validate the produced plan
        if: inputs.phase == 'plan' || inputs.phase == 'auto'
        shell: bash
        run: |
          set -euo pipefail
          change="openspec/changes/$CHANGE_ID"
          for file in proposal.md design.md tasks.md; do
            test -s "$change/$file" || { echo "::error::Missing required OpenSpec artifact: $file"; exit 1; }
          done
          find "$change/specs" -name spec.md -type f -size +0c | grep -q . || {
            echo "::error::Missing nonempty spec delta"; exit 1;
          }
          grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]xX]\]' "$change/tasks.md" || {
            echo "::error::No tasks in checklist"; exit 1;
          }
          openspec validate "$CHANGE_ID" --strict --no-interactive
          node scripts/check-openspec-task-phases.mjs "openspec/changes/$CHANGE_ID/tasks.md"
          npm run check

      # ASF-OPSX-03: publish a recoverable, plan-only checkpoint before paid apply.
      # No PR is created for auto here; plan mode publishes a draft later.
      - name: Checkpoint validated OpenSpec plan
        if: inputs.phase == 'plan' || inputs.phase == 'auto'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/agent-openspec-checkpoint.mjs" plan "$CHANGE_ID"
          git add -- "openspec/changes/$CHANGE_ID"
          node "$RUNNER_TEMP/agent-openspec-checkpoint.mjs" plan "$CHANGE_ID"
          if git diff --cached --quiet; then
            echo "::error::No new validated plan to checkpoint"; exit 1
          fi
          git commit -m "agent($TASK_ID): validated OpenSpec plan checkpoint"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -u origin "HEAD:$AGENT_BRANCH"
          echo "LAST_DURABLE_PHASE=plan" >> "$GITHUB_ENV"
          echo "CHECKPOINT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Plan checkpoint pushed: $(git rev-parse HEAD)"

      # ASF-OPSX-02: deterministic fail-closed gate before the first paid apply call.
      # Also recheck a plan already published on a persistent branch.
      - name: Gate implementation checklist before paid apply
        if: inputs.phase == 'apply' || inputs.phase == 'auto'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-openspec-task-phases.mjs "openspec/changes/$CHANGE_ID/tasks.md"

      - name: Apply the reviewed plan with OpenCode
        if: inputs.phase == 'apply' || inputs.phase == 'auto'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OpenRouter secret missing"; exit 1; }
          {
            cat <<'PROMPT'
          Implement ONLY the existing, previously proposed OpenSpec change.
          First read AGENTS.md, the backlog task and all change artifacts. Run
          'openspec instructions apply --change CHANGE' with the actual change ID.
          Implement the smallest solution meeting every delta spec and acceptance criterion.
          Read docs/factory/openspec-checklist-contract.md before implementing.
          Add/update deterministic tests, run npm run check and mark tasks.md items [x]
          only for implementation and checks actually completed with evidence during apply.
          Keep 'Manual acceptance' and 'Post-sync review' as narrative, not checklists:
          never mark them as passed, fabricate browser/manual checks or promote them
          into checkboxes. Report remaining human acceptance separately without
          silently dropping a product requirement.
          Do not alter proposal.md, design.md, delta specs or the canonical specs.
          Do not edit workflows, AGENTS.md, backlog, secrets or execution configuration.
          Do not archive, commit, push, merge or open a PR: the workflow performs these steps.
          If requirements are ambiguous or tests fail, stop and report the blocker.
          PROMPT
            printf '\nChange ID: %s\nBacklog task: %s\n' "$CHANGE_ID" "$TASK_ID"
            cat "backlog/tasks/$TASK_ID.md"
          } > "$RUNNER_TEMP/openspec-apply-prompt.txt"
          opencode run --auto --model "$OPENCODE_MODEL" "$(cat "$RUNNER_TEMP/openspec-apply-prompt.txt")"

      # ASF-OPSX-03: commit and push implementation before the paid OPSX sync.
      # This is NOT a final PR and cannot be merged as a completed feature.
      - name: Checkpoint verified implementation before OPSX sync
        if: inputs.phase == 'apply' || inputs.phase == 'auto'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Reviewed proposal, design and deltas are immutable during apply.
          plan_edits="$( (git diff --name-only -- "openspec/changes/$CHANGE_ID"; git diff --cached --name-only -- "openspec/changes/$CHANGE_ID"; git ls-files --others --exclude-standard -- "openspec/changes/$CHANGE_ID") | sort -u )"
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == "openspec/changes/$CHANGE_ID/tasks.md" ]] && continue
            echo "::error::Apply rewrote a reviewed OpenSpec artifact: $path"; exit 1
          done <<< "$plan_edits"
          tasks="openspec/changes/$CHANGE_ID/tasks.md"
          test -s "$tasks" || { echo "::error::Missing OpenSpec tasks.md"; exit 1; }
          node scripts/check-openspec-task-phases.mjs "$tasks"
          grep -Eq '^[[:space:]]*-[[:space:]]+\[[xX]\]' "$tasks" || { echo "::error::No completed checklist entries"; exit 1; }
          if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' "$tasks"; then
            echo "::error::Unchecked tasks remain; refusing checkpoint"; exit 1
          fi
          npm run check
          openspec validate "$CHANGE_ID" --strict --no-interactive
          node "$RUNNER_TEMP/agent-openspec-checkpoint.mjs" apply "$CHANGE_ID"
          git add -A
          node "$RUNNER_TEMP/agent-openspec-checkpoint.mjs" apply "$CHANGE_ID"
          if git diff --cached --quiet; then
            echo "::error::No implementation changes to checkpoint"; exit 1
          fi
          git commit -m "agent($TASK_ID): verified implementation checkpoint"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -u origin "HEAD:$AGENT_BRANCH"
          echo "LAST_DURABLE_PHASE=apply" >> "$GITHUB_ENV"
          echo "CHECKPOINT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Apply checkpoint pushed: $(git rev-parse HEAD)"

      - name: Verify, semantic sync and archive OpenSpec
        if: inputs.phase == 'apply' || inputs.phase == 'auto' || inputs.phase == 'finalize'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Finalize starts from a clean committed agent branch before semantic sync.
          if [[ "$PHASE" == finalize ]]; then
            test -z "$(git status --porcelain)" || {
              echo "::error::Finalize requires a clean worktree"; exit 1;
            }
            test -d "openspec/changes/$CHANGE_ID" || {
              echo "::error::Active change missing or already archived"; exit 1;
            }
          fi
          # The implementer may check off tasks, but cannot silently rewrite the approved plan.
          plan_edits="$( (git diff --name-only -- "openspec/changes/$CHANGE_ID"; git ls-files --others --exclude-standard -- "openspec/changes/$CHANGE_ID") | sort -u )"
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == "openspec/changes/$CHANGE_ID/tasks.md" ]] && continue
            echo "::error::Apply rewrote a reviewed OpenSpec artifact: $path"; exit 1
          done <<< "$plan_edits"
          tasks="openspec/changes/$CHANGE_ID/tasks.md"
          grep -Eq '^[[:space:]]*-[[:space:]]+\[[xX]\]' "$tasks" || {
            echo "::error::No completed checklist entries"; exit 1;
          }
          if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' "$tasks"; then
            echo "::error::Unchecked tasks remain; refusing archive"; exit 1
          fi
          npm run check
          openspec validate "$CHANGE_ID" --strict --no-interactive
          # Semantic sync: OpenCode follows the OpenSpec /opsx:sync workflow.
          # A separate paid model call is required in apply, auto and finalize.
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OpenRouter secret missing"; exit 1; }
          # Check actual bytes, even for files already modified by apply.
          node scripts/sync-guard.mjs snapshot "$RUNNER_TEMP/opsx-sync-before.json"
          # Invoke the command generated by openspec init, not a plain text
          # request merely mentioning /opsx:sync.
          # Add requirements-quality instructions to the GENERATED runner-local
          # OPSX command: preserve semantics and keep each requirement under 500 chars.
          # The command is excluded from Git and cannot enter the feature PR.
          cat docs/factory/opsx-sync-quality.md >> .opencode/commands/opsx-sync.md
          opencode run --auto --model "$OPENCODE_MODEL" --command opsx-sync "$CHANGE_ID"
          node scripts/sync-guard.mjs verify "$RUNNER_TEMP/opsx-sync-before.json"
          # Validate the resulting canonical specs WHILE the change stays active.
          # A strict warning (e.g. >500-character requirement) must not archive
          # or publish invalid specs. The remote apply checkpoint stays recoverable.
          openspec validate --all --strict --no-interactive
          # The LLM already synced canonical specs; archive without a second merge.
          openspec archive "$CHANGE_ID" --yes --skip-specs
          find openspec/changes/archive -maxdepth 1 -type d -name "*-$CHANGE_ID" | grep -q . || {
            echo "::error::OpenSpec archive missing"; exit 1;
          }
          openspec validate --all --strict --no-interactive
          openspec validate --archived --strict --no-interactive

      - name: Guard scope, commit and publish PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$AGENT_BRANCH" || {
            echo "::error::Work branch changed"; exit 1;
          }
          # The same trusted guard covers checkpoints and final PR scope.
          # Unlike .gitignore it rejects tracked files and staged changes.
          guard_phase=publish
          if [[ "$PHASE" == plan ]]; then guard_phase=plan; fi
          node "$RUNNER_TEMP/agent-openspec-checkpoint.mjs" "$guard_phase" "$CHANGE_ID"
          if [[ "$PHASE" == finalize ]]; then
            # Do not publish any uncommitted changes except the archive/sync output.
            # Existing feature commits are allowed on the task branch.
            git diff --name-only | while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                openspec/changes/"$CHANGE_ID"/*|openspec/changes/archive/*-"$CHANGE_ID"/*|openspec/specs/*) ;;
                *) echo "::error::Finalize changed forbidden path: $path"; exit 1 ;;
              esac
            done
          fi
          git add -A
          # Re-evaluate the actual index: even forced/staged tracked paths
          # must never bypass the protected-path denylist.
          node "$RUNNER_TEMP/agent-openspec-checkpoint.mjs" "$guard_phase" "$CHANGE_ID"
          if ! git diff --cached --quiet; then
            git commit -m "agent($TASK_ID): OpenSpec $PHASE"
          fi
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push -u origin "HEAD:$AGENT_BRANCH"
          existing="$(gh pr list --head "$AGENT_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$existing" ]]; then
            if [[ "$PHASE" == plan ]]; then
              gh pr create --draft --base main --head "$AGENT_BRANCH" \
                --title "OpenSpec: $TASK_ID" \
                --body "Phase plan: review the proposed OpenSpec change before manually running phase apply. No product code is changed by planning. **Never auto-merge a plan**."
            else
              gh pr create --base main --head "$AGENT_BRANCH" \
                --title "OpenSpec: $TASK_ID" \
                --body "Phase $PHASE: OpenSpec validated and archived. Independent CI required; native auto-merge may be requested if enabled and Protect Main enforces CI/check."
            fi
          else
            echo "Updated pull request: $existing"
            if [[ "$PHASE" != plan ]] && [[ "$(gh pr view "$existing" --json isDraft --jq .isDraft)" == true ]]; then
              gh pr ready "$existing"
            fi
          fi
          echo "PR_PUBLISHED=true" >> "$GITHUB_ENV"

      - name: Request safe auto-merge only for completed OpenSpec changes
        if: inputs.auto_merge == true && inputs.phase != 'plan' && env.PR_PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never auto-merge plan PRs. Gate on main ruleset + CI/check.
          node scripts/request-safe-auto-merge.mjs

      - name: Report durable checkpoint and safe recovery
        if: failure()
        shell: bash
        run: |
          # No tokens, prompts, secrets or worktree contents are exported.
          set -uo pipefail
          echo "::warning::OpenSpec run failed. Last durable checkpoint: ${LAST_DURABLE_PHASE:-none}; SHA: ${CHECKPOINT_SHA:-none}"
          {
            echo "### OpenSpec failure / recovery"
            echo "- Task: \`$TASK_ID\`; phase: \`$PHASE\`"
            echo "- Last pushed checkpoint: \`${LAST_DURABLE_PHASE:-none}\` at \`${CHECKPOINT_SHA:-none}\`"
            echo "- Branch: \`${AGENT_BRANCH:-unknown}\`"
            echo "- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [[ "${LAST_DURABLE_PHASE:-}" == apply ]]; then
              echo "- Recovery: inspect branch and run a separately authorized \`phase=finalize\`. Do not repeat paid apply."
            elif [[ "${LAST_DURABLE_PHASE:-}" == plan ]]; then
              echo "- Recovery: inspect plan and run a separately authorized \`phase=apply\`. Do not repeat paid planning."
            else
              echo "- No durable checkpoint was confirmed. Inspect GitHub state and logs before ANY paid retry."
            fi
            echo "- No automatic paid retry was started; CI, PR, merge and Pages remain unverified until independently checked."
          } >> "$GITHUB_STEP_SUMMARY"
